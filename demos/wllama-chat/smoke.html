<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wllama smoke test</title>
    <script type="importmap">
      { "imports": { "@wllama/wllama": "./node_modules/@wllama/wllama/esm/index.js" } }
    </script>
    <style>
      body { background: #0b0d10; color: #e6e9ee; font: 13px ui-monospace, Menlo, monospace; padding: 24px; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <pre id="log">booting…</pre>
    <script type="module">
      // Headless proof-of-life: download a GGUF, load it, generate, report back.
      // Driven by scripts/smoke.mjs; open it in a browser too if you like.
      import { Wllama } from '@wllama/wllama';

      const MODELS = {
        tiny: {
          url: 'https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf',
          n_ctx: 512,
          prompt: 'Once upon a time',
        },
        qwen: {
          url: 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf',
          n_ctx: 2048,
          prompt: 'In one short sentence: what is WebAssembly?',
        },
      };

      const which = new URL(location.href).searchParams.get('model') ?? 'tiny';
      const gpu = new URL(location.href).searchParams.get('gpu') === '1';
      const cfg = MODELS[which];
      const logEl = document.getElementById('log');
      const lines = [];
      const log = (s) => {
        lines.push(s);
        logEl.textContent = lines.join('\n');
        console.log(s);
      };

      async function report(payload) {
        log(JSON.stringify(payload, null, 2));
        try {
          await fetch('/__result', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ...payload, log: lines }),
          });
        } catch {}
      }

      (async () => {
        const t0 = performance.now();
        try {
          log(`model=${which} sab=${typeof SharedArrayBuffer !== 'undefined'} webgpu=${'gpu' in navigator}`);
          const wllama = new Wllama({
            default: new URL('./node_modules/@wllama/wllama/esm/wasm/wllama.wasm', location.href).href,
          });

          let lastPct = -1;
          await wllama.loadModelFromUrl(cfg.url, {
            n_ctx: cfg.n_ctx,
            n_gpu_layers: gpu ? 999 : 0,
            reasoning_format: 'none',
            progressCallback: ({ loaded, total }) => {
              const pct = Math.floor((loaded / total) * 10) * 10;
              if (pct !== lastPct) {
                lastPct = pct;
                log(`download ${pct}% (${(loaded / 1048576).toFixed(1)} MB)`);
              }
            },
          });

          const info = wllama.getLoadedContextInfo();
          const loadMs = performance.now() - t0;
          log(`loaded in ${(loadMs / 1000).toFixed(1)}s · threads=${wllama.getNumThreads()} multithread=${wllama.isMultithread()}`);

          const t1 = performance.now();
          let text = '';
          let tokens = 0;
          const hasChatTemplate = !!wllama.getChatTemplate();

          if (hasChatTemplate) {
            const stream = await wllama.createChatCompletion({
              messages: [{ role: 'user', content: cfg.prompt }],
              stream: true,
              max_tokens: 48,
              temp: 0.3,
              chat_template_kwargs: { enable_thinking: false },
            });
            for await (const chunk of stream) {
              const d = chunk.choices?.[0]?.delta?.content;
              if (d) { text += d; tokens++; }
            }
          } else {
            const stream = await wllama.createCompletion({
              prompt: cfg.prompt,
              stream: true,
              max_tokens: 32,
              temp: 0.3,
            });
            for await (const chunk of stream) {
              const d = chunk.choices?.[0]?.text;
              if (d) { text += d; tokens++; }
            }
          }

          const genMs = performance.now() - t1;
          await report({
            ok: tokens > 0 && text.trim().length > 0,
            model: which,
            path: hasChatTemplate ? 'createChatCompletion' : 'createCompletion',
            multithread: wllama.isMultithread(),
            threads: wllama.getNumThreads(),
            n_ctx: info.n_ctx,
            arch: info.metadata?.['general.architecture'],
            loadSeconds: +(loadMs / 1000).toFixed(2),
            genSeconds: +(genMs / 1000).toFixed(2),
            tokens,
            tokensPerSecond: +(tokens / (genMs / 1000)).toFixed(2),
            prompt: cfg.prompt,
            output: text,
          });
          await wllama.exit();
        } catch (e) {
          await report({ ok: false, model: which, error: `${e.name}: ${e.message}`, stack: e.stack });
        }
      })();
    </script>
  </body>
</html>
