name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: macos-arm64
            archive: tar.gz
          - os: macos-15-intel
            asset_name: macos-x64
            archive: tar.gz
          - os: ubuntu-latest
            asset_name: linux-x64
            archive: tar.gz
          - os: windows-latest
            asset_name: windows-x64
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build
        # `--features app` is what pulls in Tauri and builds the `ug-app`
        # desktop binary staged below; it is off by default so that everyday
        # `cargo build`/`cargo test` skip ~110 crates. See native/Cargo.toml.
        run: cargo build --release --features app
        working-directory: native

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp native/target/release/ug.exe native/target/release/ug-app.exe dist/
          else
            cp native/target/release/ug native/target/release/ug-app dist/
          fi

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C dist -czf ultragraph-${{ matrix.asset_name }}.tar.gz .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ultragraph-${{ matrix.asset_name }}.zip

      # `ug upgrade` refuses to install an archive it can't verify, so the
      # digest ships as its own asset alongside every archive. Format is
      # plain `shasum -a 256` output: "<hex>  <filename>".
      - name: Checksum (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          archive="ultragraph-${{ matrix.asset_name }}.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: Checksum (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "ultragraph-${{ matrix.asset_name }}.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -FilePath "$archive.sha256" -Encoding ascii -NoNewline
          Get-Content "$archive.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ultragraph-${{ matrix.asset_name }}.${{ matrix.archive }}
            ultragraph-${{ matrix.asset_name }}.${{ matrix.archive }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
