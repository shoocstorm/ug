name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3). Must already exist."
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: macos-arm64
            archive: tar.gz
          - os: macos-15-intel
            asset_name: macos-x64
            archive: tar.gz
          - os: ubuntu-latest
            asset_name: linux-x64
            archive: tar.gz
          - os: windows-latest
            asset_name: windows-x64
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install Tauri Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build
        run: cargo build --release
        working-directory: native

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp native/target/release/ug.exe native/target/release/ug-app.exe dist/
          else
            cp native/target/release/ug native/target/release/ug-app dist/
          fi

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -C dist -czf ultragraph-${{ matrix.asset_name }}.tar.gz .

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath ultragraph-${{ matrix.asset_name }}.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ultragraph-${{ matrix.asset_name }}.${{ matrix.archive }}
          generate_release_notes: true
          fail_on_unmatched_files: true
