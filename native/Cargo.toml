[package]
name = "ultragraph"
version = "0.1.14"
edition = "2021"
authors = ["Aldrick Wan"]
description = "High-Performance Graph-Based Knowledge Base Generator & Visualizer"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "ug"
path = "src/main.rs"

[[bin]]
name = "ug-app"
path = "src/bin/ug_app.rs"
# Tauri and its ~200 transitive crates exist for this binary alone — nothing
# in the library or in `ug` itself touches it, and the two talk over a URL in
# `UG_APP_URL`, not a linker symbol. Gating it keeps that whole subtree, and
# `tauri_build::build()` in build.rs, out of the everyday `cargo build` /
# `cargo test` loop. Release builds pass `--features app`.
required-features = ["app"]

[features]
default = []
app = ["dep:tauri", "dep:tauri-build"]

[dev-dependencies]
tempfile = "3"
# `ServiceExt::oneshot` — drives `serve::build_router` in-process so handler
# behaviour is testable without binding a port.
tower = { version = "0.4", features = ["util"] }

[dependencies]
rayon = "1.10"
ignore = "0.4"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps existing keys in place when we read → mutate → write
# an MCP client's JSON config (`ug mcp install`), instead of alphabetizing it.
serde_json = { version = "1", features = ["preserve_order"] }
# Read/modify/write Hermes' YAML MCP config in `ug mcp install`.
serde_yaml = "0.9"
tree-sitter = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-python = "0.20"
tree-sitter-java = "0.20"
tree-sitter-md = "0.1"
tree-sitter-rust = "0.20"
petgraph = "0.6"
regex = "1"
overgraph = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
futures = "0.3"
async-trait = "0.1"
neo4rs = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries", "hf-hub-rustls-tls"] }
dirs = "5"
# Release-archive integrity for `ug upgrade` — TLS authenticates the
# connection, the SHA-256 authenticates the bytes we're about to execute.
sha2 = "0.10"
hex = "0.4"
axum = "0.7"
tower-http = { version = "0.5", features = ["compression-br", "compression-gzip", "trace", "cors", "limit"] }
flate2 = "1"
brotli = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tauri = { version = "2", optional = true }
url = "2"

# Pure-Rust PDF text extraction. Replaces `liteparse`, which pulled in
# `liteparse-pdfium` and `dlopen`'d `libpdfium.dylib` at runtime — a native
# dependency the end user had to install and that panicked the process when
# absent. `pdf-extract` has no native deps and returns text per page via
# `extract_text_from_mem_by_pages`.
pdf-extract = "0.12"

[build-dependencies]
# Optional for the same reason `tauri` is: without the `app` feature there is
# no desktop binary to generate a context for, and `tauri_build::build()` is
# the only thing in build.rs that is not cheap.
tauri-build = { version = "2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"

# Debug info is the single largest input to link time, and linking the two
# binaries plus 21 test harnesses is where an incremental `cargo test` spends
# most of its wall clock. `line-tables-only` keeps what is actually read day
# to day — backtraces with file and line — and drops the variable/type DWARF
# that only an interactive debugger consumes. Dependencies drop it entirely:
# stepping into `tokio` is rare enough to be worth an explicit
# `--profile release` (or a temporary edit here) on the day it is needed.
[profile.dev]
debug = "line-tables-only"

# Dependencies are ~90% of the code volume in this binary (tokio, reqwest,
# ort, five tree-sitter grammars, overgraph, brotli, pdf-extract) and none of
# it changes between edits, so it is compiled once and then read from the
# cache forever. Leaving it at `opt-level = 0` inflates `target/debug/ug` to
# ~123 MB, and macOS validates the code signature of every page of a freshly
# linked Mach-O on its first execution — a cost that scales with size and is
# paid again after every link. Optimizing dependencies (but not this crate,
# whose `opt-level = 0` is what keeps the incremental rebuild at ~6s) shrinks
# the binary without touching the edit-rebuild loop.
[profile.dev.package."*"]
debug = false
opt-level = 2
